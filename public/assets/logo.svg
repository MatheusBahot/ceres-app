<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- Fundo azul profundo -->
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#1A6EBF"/>
      <stop offset="100%" stop-color="#021530"/>
    </radialGradient>
    <!-- Gradiente branco-gelo para os braços -->
    <linearGradient id="arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#A8D8FF"/>
    </linearGradient>
  </defs>
 
  <!-- Fundo circular -->
  <circle cx="20" cy="20" r="20" fill="url(#bg)"/>
 
  <!-- ═══ 6 BRAÇOS PRINCIPAIS (ângulos 0°, 60°, 120°, 180°, 240°, 300°) ═══ -->
  <!-- Calculados: centro=20,20, comprimento=14 -->
  <!-- 0°   → (20,20) para (20, 6)  -->
  <!-- 60°  → (20,20) para (32.1, 13) -->
  <!-- 120° → (20,20) para (32.1, 27) -->
  <!-- 180° → (20,20) para (20, 34) -->
  <!-- 240° → (20,20) para (7.9, 27) -->
  <!-- 300° → (20,20) para (7.9, 13) -->
 
  <g stroke="url(#arm)" stroke-linecap="round">
 
    <!-- Braço 0° (cima) -->
    <line x1="20" y1="20" x2="20" y2="6"    stroke-width="2.2"/>
    <!-- Braço 180° (baixo) -->
    <line x1="20" y1="20" x2="20" y2="34"   stroke-width="2.2"/>
    <!-- Braço 60° (direita-cima) -->
    <line x1="20" y1="20" x2="32.1" y2="13" stroke-width="2.2"/>
    <!-- Braço 240° (esquerda-baixo) -->
    <line x1="20" y1="20" x2="7.9" y2="27"  stroke-width="2.2"/>
    <!-- Braço 120° (direita-baixo) -->
    <line x1="20" y1="20" x2="32.1" y2="27" stroke-width="2.2"/>
    <!-- Braço 300° (esquerda-cima) -->
    <line x1="20" y1="20" x2="7.9" y2="13"  stroke-width="2.2"/>
 
    <!-- ══ RAMIFICAÇÕES (a 50% de cada braço) ══ -->
    <!-- Cada braço tem 2 galhos simétricos no ponto médio (a 7px do centro) -->
    <!-- Galhos têm comprimento 4 e saem a ±60° do braço principal -->
 
    <!-- Braço 0° — ponto médio (20, 13) — galhos horizontais -->
    <line x1="20" y1="13" x2="16.5" y2="10" stroke-width="1.4"/>
    <line x1="20" y1="13" x2="23.5" y2="10" stroke-width="1.4"/>
 
    <!-- Braço 180° — ponto médio (20, 27) — galhos horizontais -->
    <line x1="20" y1="27" x2="16.5" y2="30" stroke-width="1.4"/>
    <line x1="20" y1="27" x2="23.5" y2="30" stroke-width="1.4"/>
 
    <!-- Braço 60° — ponto médio (26.05, 16.5) — galhos perpendiculares -->
    <line x1="26.05" y1="16.5" x2="24.05" y2="13"   stroke-width="1.4"/>
    <line x1="26.05" y1="16.5" x2="29.05" y2="14.5" stroke-width="1.4"/>
 
    <!-- Braço 240° — ponto médio (13.95, 23.5) -->
    <line x1="13.95" y1="23.5" x2="10.95" y2="25.5" stroke-width="1.4"/>
    <line x1="13.95" y1="23.5" x2="15.95" y2="27"   stroke-width="1.4"/>
 
    <!-- Braço 120° — ponto médio (26.05, 23.5) -->
    <line x1="26.05" y1="23.5" x2="29.05" y2="25.5" stroke-width="1.4"/>
    <line x1="26.05" y1="23.5" x2="24.05" y2="27"   stroke-width="1.4"/>
 
    <!-- Braço 300° — ponto médio (13.95, 16.5) -->
    <line x1="13.95" y1="16.5" x2="10.95" y2="14.5" stroke-width="1.4"/>
    <line x1="13.95" y1="16.5" x2="15.95" y2="13"   stroke-width="1.4"/>
 
    <!-- ══ PONTAS DOS 6 BRAÇOS (traço perpendicular final) ══ -->
    <!-- Topo (20,6) — horizontal -->
    <line x1="17.5" y1="6"    x2="22.5" y2="6"    stroke-width="1.6"/>
    <!-- Base (20,34) — horizontal -->
    <line x1="17.5" y1="34"   x2="22.5" y2="34"   stroke-width="1.6"/>
    <!-- Dir-cima (32.1,13) — perpendicular ao braço 60° -->
    <line x1="30.5" y1="10.5" x2="33.7" y2="15.5" stroke-width="1.6"/>
    <!-- Esq-baixo (7.9,27) -->
    <line x1="6.3"  y1="24.5" x2="9.5"  y2="29.5" stroke-width="1.6"/>
    <!-- Dir-baixo (32.1,27) -->
    <line x1="30.5" y1="29.5" x2="33.7" y2="24.5" stroke-width="1.6"/>
    <!-- Esq-cima (7.9,13) -->
    <line x1="6.3"  y1="15.5" x2="9.5"  y2="10.5" stroke-width="1.6"/>
 
  </g>
 
  <!-- ══ CENTRO — hexágono suave ══ -->
  <circle cx="20" cy="20" r="4"   fill="#0A84FF" opacity="0.5"/>
  <circle cx="20" cy="20" r="2.8" fill="#C8E8FF"/>
  <circle cx="20" cy="20" r="1.4" fill="#0A84FF"/>
 
  <!-- Brilho sutil no canto superior esquerdo -->
  <circle cx="15" cy="14" r="3" fill="white" opacity="0.06"/>
</svg>
