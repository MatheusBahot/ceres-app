<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Eixo vertical -->
  <line x1="20" y1="3"  x2="20" y2="37" stroke="url(#ax)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eixo horizontal -->
  <line x1="3"  y1="20" x2="37" y2="20" stroke="url(#ax)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eixo diagonal \ -->
  <line x1="7"  y1="7"  x2="33" y2="33" stroke="url(#ax)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eixo diagonal / -->
  <line x1="33" y1="7"  x2="7"  y2="33" stroke="url(#ax)" stroke-width="2.2" stroke-linecap="round"/>
 
  <!-- Nodo central -->
  <circle cx="20" cy="20" r="3.5" fill="#fff" opacity="0.95"/>
 
  <!-- Pontas dos eixos — pequenas barras perpendiculares (cristal) -->
  <!-- Topo -->
  <line x1="17.5" y1="5.5" x2="22.5" y2="5.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="17.5" y1="34.5" x2="22.5" y2="34.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Esquerda -->
  <line x1="5.5" y1="17.5" x2="5.5" y2="22.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Direita -->
  <line x1="34.5" y1="17.5" x2="34.5" y2="22.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Diagonais - pontas pequenas -->
  <line x1="5.5"  y1="8.5"  x2="8.5"  y2="5.5"  stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="31.5" y1="5.5"  x2="34.5" y2="8.5"  stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5.5"  y1="31.5" x2="8.5"  y2="34.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="31.5" y1="34.5" x2="34.5" y2="31.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
 
  <!-- Sub-pontos nos eixos (metade do caminho) -->
  <circle cx="20" cy="9"  r="1.6" fill="#fff" opacity="0.7"/>
  <circle cx="20" cy="31" r="1.6" fill="#fff" opacity="0.7"/>
  <circle cx="9"  cy="20" r="1.6" fill="#fff" opacity="0.7"/>
  <circle cx="31" cy="20" r="1.6" fill="#fff" opacity="0.7"/>
  <circle cx="12.5" cy="12.5" r="1.4" fill="#fff" opacity="0.6"/>
  <circle cx="27.5" cy="12.5" r="1.4" fill="#fff" opacity="0.6"/>
  <circle cx="12.5" cy="27.5" r="1.4" fill="#fff" opacity="0.6"/>
  <circle cx="27.5" cy="27.5" r="1.4" fill="#fff" opacity="0.6"/>
 
  <!-- Fundo circular gradiente -->
  <circle cx="20" cy="20" r="19" fill="url(#bg)" opacity="0.12"/>
 
  <defs>
    <linearGradient id="ax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5AC8FA"/>
      <stop offset="50%"  stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#003A8C"/>
    </radialGradient>
  </defs>
</svg>
