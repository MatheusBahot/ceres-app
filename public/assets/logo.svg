<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Eixo vertical -->
  <line x1="20" y1="4"  x2="20" y2="36" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eixo horizontal -->
  <line x1="4"  y1="20" x2="36" y2="20" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal \ -->
  <line x1="8.5" y1="8.5"  x2="31.5" y2="31.5" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal / -->
  <line x1="31.5" y1="8.5" x2="8.5"  y2="31.5" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
 
  <!-- Galhos no eixo vertical -->
  <line x1="16" y1="10" x2="20" y2="14" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="10" x2="20" y2="14" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="20" y2="26" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="20" y2="26" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Galhos no eixo horizontal -->
  <line x1="10" y1="16" x2="14" y2="20" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="24" x2="14" y2="20" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="16" x2="26" y2="20" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="26" y2="20" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"/>
 
  <!-- Ponto central -->
  <circle cx="20" cy="20" r="2.5" fill="#0A84FF"/>
</svg>
