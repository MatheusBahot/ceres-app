<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Fundo círculo frio/gelo -->
  <circle cx="20" cy="20" r="18" fill="url(#bg)"/>
  <!-- Letra I estilizada (linha vertical com pontos) -->
  <rect x="18.5" y="9" width="3" height="3" rx="1.5" fill="#fff"/>
  <rect x="18.5" y="14" width="3" height="14" rx="1.5" fill="#fff"/>
  <!-- Cristal de gelo sutil nos cantos -->
  <line x1="20" y1="3" x2="20" y2="6" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="34" x2="20" y2="37" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="20" x2="6" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="37" y2="20" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="7" x2="9.5" y2="9.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="33" y1="7" x2="30.5" y2="9.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="7" y1="33" x2="9.5" y2="30.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="33" y1="33" x2="30.5" y2="30.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round"/>
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#5AC8FA"/>
      <stop offset="45%"  stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#003A8C"/>
    </radialGradient>
  </defs>
</svg>
