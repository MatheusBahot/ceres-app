<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I·ten — Pesquisa</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/ceres.css">
  <style>
    .page-head { padding:40px 0 28px; border-bottom:1px solid var(--c-border); margin-bottom:28px; }
    .page-head h1 { font-size:2rem; font-weight:700; letter-spacing:-.03em; margin-bottom:4px; }
    .page-head p  { font-size:.88rem; color:var(--c-text-2); }
 
    /* BREADCRUMB */
    .bc { display:flex; align-items:center; gap:6px; font-size:.82rem; margin-bottom:20px; flex-wrap:wrap; min-height:22px; }
    .bc-step { color:var(--c-text-3); font-weight:500; }
    .bc-step.link { color:var(--c-accent); cursor:pointer; font-weight:600; }
    .bc-step.link:hover { text-decoration:underline; }
    .bc-step.atual { color:var(--c-text); font-weight:700; }
    .bc-sep { color:var(--c-text-3); }
 
    /* PAINÉIS */
    .painel { display:none; }
    .painel.ativo { display:block; animation:fadeIn .15s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
 
    /* LINHA DE CONTROLES */
    .linha-ctrl { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .info-count { font-size:.76rem; color:var(--c-text-3); font-weight:700; letter-spacing:.02em; }
 
    /* BARRA A-Z */
    .alpha-bar { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:14px; }
    .alpha-btn {
      padding:3px 8px; border-radius:6px; border:1px solid var(--c-border);
      background:var(--c-bg-card); font-size:.73rem; font-weight:700;
      color:var(--c-text-2); cursor:pointer; font-family:inherit;
      transition:all .12s; min-width:26px; text-align:center;
    }
    .alpha-btn:hover:not([disabled]) { border-color:var(--c-accent); color:var(--c-accent); }
    .alpha-btn.ativo { background:var(--c-accent); color:#fff; border-color:var(--c-accent); }
    .alpha-btn[disabled] { opacity:.25; cursor:default; }
 
    /* GRID DE CIDADES */
    .city-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(152px, 1fr));
      gap:6px;
    }
    .city-btn {
      background:var(--c-bg-card); border:1px solid var(--c-border);
      border-radius:var(--c-radius); padding:10px 14px;
      font-size:.83rem; font-weight:600; color:var(--c-text);
      text-align:left; cursor:pointer; font-family:inherit; width:100%;
      transition:border-color .12s, color .12s, background .12s;
    }
    .city-btn:hover { border-color:var(--c-accent); color:var(--c-accent); background:rgba(10,132,255,.04); }
 
    /* LISTA DE GRUPOS */
    .group-list { display:flex; flex-direction:column; gap:6px; }
    .group-btn {
      background:var(--c-bg-card); border:1px solid var(--c-border);
      border-radius:var(--c-radius-lg); padding:16px 20px;
      display:flex; align-items:center; justify-content:space-between;
      cursor:pointer; font-family:inherit; width:100%; text-align:left;
      transition:border-color .12s, box-shadow .12s;
    }
    .group-btn:hover { border-color:var(--c-accent); box-shadow:0 0 0 3px rgba(10,132,255,.07); }
    .group-esq { display:flex; align-items:center; gap:12px; }
    .group-bolinha { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
    .group-nome { font-size:.95rem; font-weight:700; color:var(--c-text); }
    .group-qtd  { font-size:.78rem; color:var(--c-text-2); margin-top:2px; }
 
    /* LISTA DE EMPRESAS */
    .empresa-wrap { border:1px solid var(--c-border); border-radius:var(--c-radius-lg); overflow:hidden; }
    .empresa-row {
      background:var(--c-bg-card); padding:15px 20px;
      border-bottom:1px solid var(--c-border);
      display:flex; align-items:center; gap:14px;
      transition:background .1s;
    }
    .empresa-row:last-child { border-bottom:none; }
    .empresa-row:hover { background:rgba(10,132,255,.025); }
    .empresa-info { flex:1; min-width:0; }
 
    /* NOME em destaque — primeira linha */
    .empresa-nome {
      font-size:.95rem; font-weight:800; color:var(--c-text);
      letter-spacing:-.01em; line-height:1.2;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    /* CNPJ + telefone + email — segunda linha */
    .empresa-dados {
      display:flex; flex-wrap:wrap; gap:8px; align-items:center;
      margin-top:4px; font-size:.76rem;
    }
    .cnpj-tag {
      font-family:monospace; font-size:.72rem; font-weight:700;
      color:var(--c-text-2); background:var(--c-bg);
      border:1px solid var(--c-border); border-radius:5px;
      padding:1px 7px; letter-spacing:.03em; white-space:nowrap;
    }
    .empresa-dados a { color:var(--c-accent); font-weight:600; text-decoration:none; white-space:nowrap; }
    .empresa-dados a:hover { text-decoration:underline; }
    /* SEGMENTO — terceira linha */
    .empresa-seg {
      font-size:.66rem; font-weight:700; letter-spacing:.07em;
      text-transform:uppercase; color:var(--c-text-3); margin-top:5px;
    }
    .group-btn-inativo {
      background:var(--c-bg); border:1px solid var(--c-border);
      border-radius:var(--c-radius-lg); padding:16px 20px;
      display:flex; align-items:center;
      opacity:0.45; cursor:not-allowed;
    }
    .empresa-acoes { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
 
    /* ESTADOS */
    .estado-vazio   { padding:48px 24px; text-align:center; color:var(--c-text-3); font-size:.88rem; }
    .estado-loading { padding:32px; text-align:center; }
 
    /* MODAL */
    .m-topo { padding-bottom:14px; border-bottom:1px solid var(--c-border); margin-bottom:14px; }
    .m-nome { font-size:1.15rem; font-weight:800; letter-spacing:-.025em; color:var(--c-text); line-height:1.25; margin-bottom:8px; word-break:break-word; }
    .m-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .m-tag  {
      font-size:.65rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.07em; padding:2px 10px; border-radius:100px;
    }
    .m-tag-seg { background:rgba(10,132,255,.1); color:#004BB0; }
    .m-tag-grp { background:rgba(0,0,0,.06); color:var(--c-text-2); }
 
    .m-campos { display:flex; flex-direction:column; }
    .m-campo  { padding:11px 0; border-bottom:1px solid var(--c-border); display:flex; flex-direction:column; gap:3px; }
    .m-campo:last-child { border-bottom:none; }
    .m-label  { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--c-text-3); }
    .m-valor  { font-size:.92rem; color:var(--c-text); font-weight:500; line-height:1.45; }
    .m-valor.mono { font-family:monospace; letter-spacing:.04em; font-size:.88rem; }
    .m-valor a { color:var(--c-accent); font-weight:700; text-decoration:none; }
    .m-valor a:hover { text-decoration:underline; }
    .m-valor .sep { color:var(--c-border); margin:0 6px; }
    .m-vazio { color:var(--c-text-3); font-style:italic; font-size:.82rem; }
 
    .m-rodape { margin-top:18px; }
    .m-erro   { padding:24px; text-align:center; color:var(--c-danger); font-size:.88rem; }
  </style>
</head>
<body>
 
<nav class="navbar">
  <a class="navbar-brand" href="/home">
    <img src="/assets/logo.svg" alt="I·ten" width="28" height="28">I·ten
  </a>
  <ul class="navbar-nav">
    <li><a href="/home">Início</a></li>
    <li><a href="/search">Pesquisa</a></li>
    <li><a href="/wallet">Carteira</a></li>

    <li><a href="/reports">Reportar</a></li>

      <div class="avatar" id="user-dropdown-btn"></div>
      <div class="dropdown-menu" id="user-dropdown" style="display:none;">
        <div style="padding:12px 14px;border-bottom:1px solid var(--c-border);">
          <div class="fw-600" style="font-size:.9rem;" id="dd-name"></div>

<div class="page-wrapper">
  <div class="container">
 
    <div class="page-head">
      <h1>Pesquisa</h1>
      <p>Selecione um município, depois o segmento e visualize as empresas disponíveis para prospecção.</p>
    </div>
 
    <!-- BUSCA GLOBAL -->
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:24px;">
      <div class="search-bar" style="flex:1;max-width:480px;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="color:var(--c-text-3);flex-shrink:0;">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.868-3.834zm-5.242 1.406a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
        </svg>
        <input type="text" id="busca-global" placeholder="Buscar por nome, razão social ou CNPJ em toda a base…" autocomplete="off">
      </div>
      <button class="btn btn-secondary btn-sm" id="btn-limpar" style="display:none;" onclick="limparBusca()">Limpar</button>
    </div>
 
    <!-- BREADCRUMB -->
    <div class="bc" id="bc"></div>
 
    <!-- PAINEL: CIDADES -->
    <div class="painel ativo" id="painel-cidades">
      <div class="linha-ctrl">
        <div class="search-bar" style="max-width:300px;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="color:var(--c-text-3);flex-shrink:0;">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.868-3.834zm-5.242 1.406a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
          </svg>
          <input type="text" id="filtro-cidade" placeholder="Filtrar município…" autocomplete="off">
        </div>
        <span class="info-count" id="info-cidades"></span>
      </div>
      <div class="alpha-bar" id="alpha-bar"></div>
      <div class="city-grid" id="grid-cidades">
        <div class="estado-loading" style="grid-column:1/-1;">
          <div class="spinner spinner-dark" style="margin:0 auto;"></div>
        </div>
      </div>
    </div>
 
    <!-- PAINEL: GRUPOS -->
    <div class="painel" id="painel-grupos">
      <div class="group-list" id="lista-grupos">
        <div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>
      </div>
    </div>
 
    <!-- PAINEL: EMPRESAS -->
    <div class="painel" id="painel-empresas">
      <div class="linha-ctrl">
        <div class="search-bar" style="max-width:340px;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="color:var(--c-text-3);flex-shrink:0;">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.868-3.834zm-5.242 1.406a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
          </svg>
          <input type="text" id="filtro-empresa" placeholder="Filtrar nesta listagem…" autocomplete="off">
        </div>
        <span class="info-count" id="info-empresas"></span>
      </div>
      <div id="lista-empresas">
        <div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>
      </div>
    </div>
 
    <!-- PAINEL: RESULTADO GLOBAL -->
    <div class="painel" id="painel-global">
      <div class="linha-ctrl"><span class="info-count" id="info-global"></span></div>
      <div id="lista-global">
        <div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>
      </div>
    </div>
 
  </div>
</div>
 
<!-- MODAL EMPRESA -->
<div id="modal" style="display:none;" class="modal-backdrop">
  <div class="modal" style="max-width:460px;">
    <div class="modal-header" style="margin-bottom:0;padding-bottom:12px;">
      <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c-text-3);">Detalhes da Empresa</span>
      <button class="modal-close" id="btn-fechar-modal">✕</button>
    </div>
    <div id="modal-corpo"></div>
    <div id="modal-rodape" style="margin-top:18px;"></div>
  </div>
</div>
 
<div id="toast-container"></div>
<script src="/js/ceres.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// CERES — search.html
// ─────────────────────────────────────────────────────────────────────────────
requireAuth();
 
// ── ESTADO ────────────────────────────────────────────────────────────────────
let todasCidades  = [];  // [{municipio, total}]
let cidadeAtual   = '';
let grupoAtual    = '';
let empresasAtuais = [];  // array de empresas carregadas
const cacheModal  = {};  // { [id]: empresa }
let letraAtiva    = '';
let cidadesTocadas = false; // vira true só depois que o usuário digita ou clica em uma letra/"Todas"
let timerBusca;
 
// ── GRUPOS ────────────────────────────────────────────────────────────────────
 
const TODOS_GRUPOS = [
  { grupo: 'SUPERMERCADOS E MERCEARIAS',    icon: '🛒', cor: '#1A4D00' },
  { grupo: 'PADARIAS E FOOD SERVICE',       icon: '🥐', cor: '#7A3B00' },
  { grupo: 'FARMÁCIAS E DROGARIAS',         icon: '💊', cor: '#003580' },
  { grupo: 'LABORATÓRIOS E CLÍNICAS',       icon: '🔬', cor: '#006064' },
  { grupo: 'HOTÉIS E POUSADAS',             icon: '🏨', cor: '#4A2000' },
  { grupo: 'CONSTRUTORAS E OBRAS',          icon: '🏗️',  cor: '#0277BD' },
  { grupo: 'ARQUITETURA E ENGENHARIA',      icon: '📐', cor: '#4527A0' },
  { grupo: 'INDÚSTRIA E ATACADO ALIMENTOS', icon: '🏭', cor: '#F57F17' },
  { grupo: 'FRIGORÍFICOS E CARNES',         icon: '🥩', cor: '#7F0000' },
  { grupo: 'EVENTOS E BUFFET',              icon: '🎉', cor: '#33691E' },
  { grupo: 'INSTALAÇÕES REFRIGERAÇÃO/HVAC', icon: '❄️',  cor: '#006994' },
  { grupo: 'FLORICULTURAS',                 icon: '🌸', cor: '#2E7D32' },
];
 
// ── PAINÉIS ───────────────────────────────────────────────────────────────────
function mostrarPainel(nome) {
  ['cidades','grupos','empresas','global'].forEach(n => {
    const el = document.getElementById('painel-' + n);
    el.classList.toggle('ativo', n === nome);
  });
}
 
// ── BREADCRUMB ────────────────────────────────────────────────────────────────
function renderBc() {
  const el = document.getElementById('bc');
  const partes = [];
 
  if (!cidadeAtual) {
    partes.push('<span class="bc-step atual">Municípios</span>');
  } else {
    partes.push('<span class="bc-step link" onclick="voltarPara(\'cidades\')">Municípios</span>');
    partes.push('<span class="bc-sep">›</span>');
    if (grupoAtual) {
      partes.push('<span class="bc-step link" onclick="voltarPara(\'grupos\')">' + escHtml(cidadeAtual) + '</span>');
      partes.push('<span class="bc-sep">›</span>');
      partes.push('<span class="bc-step atual">' + escHtml(grupoAtual) + '</span>');
    } else {
      partes.push('<span class="bc-step atual">' + escHtml(cidadeAtual) + '</span>');
    }
  }
  el.innerHTML = partes.join(' ');
}
 
function voltarPara(destino) {
  if (destino === 'cidades') {
    cidadeAtual = ''; grupoAtual = '';
    renderBc(); mostrarPainel('cidades');
  } else if (destino === 'grupos') {
    grupoAtual = '';
    renderBc(); mostrarPainel('grupos');
  }
}
 
// ── CIDADES ───────────────────────────────────────────────────────────────────
async function carregarCidades() {
  try {
    const dados = await api('/companies/cities');
    // Normalizar: aceita [{municipio, total}] ou ["CIDADE", ...]
    todasCidades = dados.map(d => {
      if (typeof d === 'string') return { municipio: d, total: 0 };
      return d;
    });
    construirBarraAlpha(todasCidades);
    mostrarEstadoInicialCidades();
  } catch(e) {
    document.getElementById('grid-cidades').innerHTML =
      '<div class="estado-vazio" style="grid-column:1/-1;">Erro ao carregar municípios. Verifique a conexão.</div>';
  }
}

// Estado inicial: nenhuma cidade listada até o usuário buscar ou escolher uma letra
function mostrarEstadoInicialCidades() {
  document.getElementById('grid-cidades').innerHTML =
    '<div class="estado-vazio" style="grid-column:1/-1;">Digite o nome do município ou escolha uma letra acima para localizá-lo.</div>';
  document.getElementById('info-cidades').textContent =
    todasCidades.length + ' municípios disponíveis';
}
 
function construirBarraAlpha(cidades) {
  const letras = new Set(cidades.map(c => c.municipio.charAt(0).toUpperCase()));
  const bar = document.getElementById('alpha-bar');
  const botoes = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => {
    const tem = letras.has(l);
    return `<button class="alpha-btn${tem?'':''}"${tem?'':' disabled'}
      onclick="${tem?`filtrarAlpha('${l}')`:''}">${l}</button>`;
  });
  botoes.push(`<button class="alpha-btn ativo" id="alpha-todas" onclick="filtrarAlpha('')">Todas</button>`);
  bar.innerHTML = botoes.join('');
}
 
function filtrarAlpha(letra) {
  cidadesTocadas = true;
  letraAtiva = letra;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('ativo'));
  if (letra) {
    document.querySelectorAll('.alpha-btn').forEach(b => {
      if (b.textContent.trim() === letra) b.classList.add('ativo');
    });
  } else {
    const btn = document.getElementById('alpha-todas');
    if (btn) btn.classList.add('ativo');
  }
  aplicarFiltroCidade();
}
 
function aplicarFiltroCidade() {
  const q = document.getElementById('filtro-cidade').value.toLowerCase().trim();
  if (q) cidadesTocadas = true;
  if (!cidadesTocadas) { mostrarEstadoInicialCidades(); return; }
  let lista = todasCidades;
  if (letraAtiva) lista = lista.filter(c => c.municipio.toUpperCase().startsWith(letraAtiva));
  if (q) lista = lista.filter(c => c.municipio.toLowerCase().includes(q));
  renderCidades(lista);
}
 
document.getElementById('filtro-cidade').addEventListener('input', aplicarFiltroCidade);
 
function renderCidades(lista) {
  const grid = document.getElementById('grid-cidades');
  document.getElementById('info-cidades').textContent =
    lista.length + ' município' + (lista.length !== 1 ? 's' : '');
 
  if (!lista.length) {
    grid.innerHTML = '<div class="estado-vazio" style="grid-column:1/-1;">Nenhum município encontrado.</div>';
    return;
  }
 
  grid.innerHTML = lista.map(c => {
    const nome = escHtml(c.municipio);
    const nomeSafe = c.municipio.replace(/'/g, "\\'");
    return `<button class="city-btn" onclick="selecionarCidade('${nomeSafe}')">${nome}</button>`;
  }).join('');
}
 
// ── SELECIONAR CIDADE ─────────────────────────────────────────────────────────
async function selecionarCidade(cidade) {
  cidadeAtual = cidade;
  grupoAtual  = '';
  renderBc();
  mostrarPainel('grupos');
 
  document.getElementById('lista-grupos').innerHTML =
    '<div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>';
 
  try {
    const grupos = await api('/companies/groups/' + encodeURIComponent(cidade));
    renderGrupos(grupos);
  } catch(e) {
    document.getElementById('lista-grupos').innerHTML =
      '<div class="estado-vazio">Erro ao carregar segmentos.</div>';
  }
}
 
function renderGrupos(gruposDaCidade) {
  const el = document.getElementById('lista-grupos');
  // Mapear grupos que existem nesta cidade { grupo: total }
  const mapa = {};
  (gruposDaCidade || []).forEach(g => { mapa[g.grupo] = g.total; });
 
  // Mostrar SEMPRE os 12 grupos — ativos ou inativos
  el.innerHTML = TODOS_GRUPOS.map(def => {
    const total = mapa[def.grupo] || 0;
    const ativo = total > 0;
    const nomeSafe = def.grupo.replace(/'/g, "\\'");
    const qtdTxt = ativo
      ? def.total + ' empresa' + (total !== 1 ? 's' : '')
      : 'Sem empresas neste município';
 
    if (ativo) {
      return `<button class="group-btn" onclick="selecionarGrupo('${nomeSafe}')">
        <div class="group-esq">
          <div class="group-bolinha" style="background:${def.cor};"></div>
          <div>
            <div class="group-nome">${escHtml(def.grupo)}</div>
            <div class="group-qtd">${total} empresa${total !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <span style="color:var(--c-text-3);">›</span>
      </button>`;
    } else {
      return `<div class="group-btn group-btn-inativo">
        <div class="group-esq">
          <div class="group-bolinha" style="background:#D1D1D6;"></div>
          <div>
            <div class="group-nome" style="color:var(--c-text-3);">${escHtml(def.grupo)}</div>
            <div class="group-qtd">Sem empresas neste município</div>
          </div>
        </div>
      </div>`;
    }
  }).join('');
}
 
// ── SELECIONAR GRUPO ──────────────────────────────────────────────────────────
async function selecionarGrupo(grupo) {
  grupoAtual = grupo;
  renderBc();
  mostrarPainel('empresas');
  document.getElementById('filtro-empresa').value = '';
  document.getElementById('lista-empresas').innerHTML =
    '<div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>';
 
  try {
    const url = '/companies/list'
      + '?city='  + encodeURIComponent(cidadeAtual)
      + '&group=' + encodeURIComponent(grupo);
    empresasAtuais = await api(url);
 
    document.getElementById('info-empresas').textContent =
      empresasAtuais.length + ' empresa' + (empresasAtuais.length !== 1 ? 's' : '');
 
    renderEmpresas(empresasAtuais, 'lista-empresas');
  } catch(e) {
    document.getElementById('lista-empresas').innerHTML =
      '<div class="estado-vazio">Erro ao carregar empresas.</div>';
  }
}
 
// Filtro local de empresas
document.getElementById('filtro-empresa').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const filtradas = q
    ? empresasAtuais.filter(c =>
        (c.nome_fantasia || '').toLowerCase().includes(q) ||
        (c.razao_social  || '').toLowerCase().includes(q) ||
        (c.cnpj          || '').includes(q))
    : empresasAtuais;
  renderEmpresas(filtradas, 'lista-empresas');
});
 
// ── RENDERIZAR LISTA DE EMPRESAS ──────────────────────────────────────────────
function renderEmpresas(lista, containerId) {
  const el = document.getElementById(containerId);
  if (!lista || !lista.length) {
    el.innerHTML = '<div class="estado-vazio">Nenhuma empresa disponível nesta seleção.</div>';
    return;
  }
  el.innerHTML = '<div class="empresa-wrap">' + lista.map(c => buildCard(c)).join('') + '</div>';
}
 
function buildCard(c) {
  // Campos principais
  const id   = parseInt(c.id, 10);
  const nome = escHtml(c.nome_fantasia || c.razao_social || '—');
 
  // CNPJ
  const cnpjRaw = (c.cnpj || '').replace(/\D/g, '');
  const cnpjFmt = cnpjRaw.length >= 14
    ? cnpjRaw.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5')
    : (cnpjRaw || null);
 
  // Contatos
  const tels = [c.tel1, c.tel2, c.tel3].filter(Boolean);
  const dados = [];
  if (cnpjFmt) dados.push(`<span class="cnpj-tag">${cnpjFmt}</span>`);
  tels.slice(0, 2).forEach(t =>
    dados.push(`<a href="tel:${escHtml(t)}">📞 ${escHtml(t)}</a>`)
  );
  if (c.email) dados.push(`<a href="mailto:${escHtml(c.email)}">✉ ${escHtml(c.email)}</a>`);
 
  // Botão carteira
  const naCarteira = c.in_my_wallet == 1 || c.in_my_wallet === true;
  const btnWhatsapp = c.whatsapp
    ? '<a class="btn btn-sm btn-whatsapp" href="https://wa.me/' + c.whatsapp.replace(/\D/g,'') +
      '" target="_blank" rel="noopener">💬 WhatsApp' + (c.whatsapp_business ? ' Business' : '') + '</a>'
    : '';
  const btnInstagram = c.instagram
    ? '<a class="btn btn-sm btn-social" href="' + c.instagram + '" target="_blank" rel="noopener">📷 Instagram</a>'
    : '';
  const btnFacebook = c.facebook
    ? '<a class="btn btn-sm btn-social" href="' + c.facebook + '" target="_blank" rel="noopener">👍 Facebook</a>'
    : '';
  const btnSite = c.site
    ? '<a class="btn btn-sm btn-secondary" href="' + c.site + '" target="_blank" rel="noopener">🌐 Site</a>'
    : '';
  const btnCarteira = naCarteira
    ? `<span class="badge badge-green" data-wid="${id}">Na carteira</span>`
    : `<button class="btn btn-sm btn-primary" onclick="adicionarCarteira(${id}, this)">+ Carteira</button>`;
 
  return `<div class="empresa-row">
    <div class="empresa-info">
      <div class="empresa-nome">${nome}</div>
      <div class="empresa-dados">${dados.join('')}</div>
      <div class="empresa-seg">${escHtml(c.segmento || c.grupo || '')}</div>
    </div>
    <div class="empresa-acoes">
      ${btnWhatsapp}
      ${btnInstagram}
      ${btnFacebook}
      ${btnSite}
      ${btnCarteira}
      <button class="btn btn-sm btn-secondary" onclick="abrirModal(${id})">Ver</button>
    </div>
  </div>`;
}
 
// ── BUSCA GLOBAL ──────────────────────────────────────────────────────────────
document.getElementById('busca-global').addEventListener('input', function() {
  const q = this.value.trim();
  document.getElementById('btn-limpar').style.display = q ? 'inline-flex' : 'none';
  clearTimeout(timerBusca);
  if (!q) { mostrarPainel('cidades'); cidadeAtual = ''; grupoAtual = ''; renderBc(); return; }
  if (q.length < 2) return;
 
  timerBusca = setTimeout(async () => {
    cidadeAtual = ''; grupoAtual = '';
    renderBc(); mostrarPainel('global');
    document.getElementById('lista-global').innerHTML =
      '<div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>';
 
    try {
      const resultados = await api('/companies/list?q=' + encodeURIComponent(q));
      empresasAtuais = resultados;
      document.getElementById('info-global').textContent =
        resultados.length + ' resultado' + (resultados.length !== 1 ? 's' : '') +
        ' para "' + escHtml(q) + '"';
 
      if (!resultados.length) {
        document.getElementById('lista-global').innerHTML =
          '<div class="estado-vazio">Nenhuma empresa encontrada.</div>';
        return;
      }
      renderEmpresas(resultados, 'lista-global');
    } catch(e) {
      document.getElementById('lista-global').innerHTML =
        '<div class="estado-vazio">Erro ao buscar.</div>';
    }
  }, 380);
});
 
function limparBusca() {
  document.getElementById('busca-global').value = '';
  document.getElementById('btn-limpar').style.display = 'none';
  cidadeAtual = ''; grupoAtual = '';
  renderBc(); mostrarPainel('cidades');
}
 
// ── ADICIONAR À CARTEIRA ──────────────────────────────────────────────────────
async function adicionarCarteira(id, btn) {
  btn.disabled = true;
  btn.innerHTML = '…';
  try {
    await api('/wallet/add/' + id, { method: 'POST' });
    btn.outerHTML = `<span class="badge badge-green" data-wid="${id}">Na carteira</span>`;
    const item = empresasAtuais.find(c => parseInt(c.id) === id);
    if (item) item.in_my_wallet = 1;
    toast('Empresa adicionada à carteira.', 'success');
  } catch(e) {
    toast(e.message || 'Erro ao adicionar.', 'error');
    btn.disabled = false;
    btn.innerHTML = '+ Carteira';
  }
}
 
// ── MODAL — VER EMPRESA ───────────────────────────────────────────────────────
async function abrirModal(id) {
  if (!id || isNaN(id)) {
    toast('ID de empresa inválido.', 'error');
    return;
  }
 
  const modal = document.getElementById('modal');
  modal.style.display = 'flex';
  document.getElementById('modal-corpo').innerHTML =
    '<div class="estado-loading"><div class="spinner spinner-dark" style="margin:0 auto;"></div></div>';
  document.getElementById('modal-rodape').innerHTML = '';
 
  try {
    // Usar cache se disponível
    let c = cacheModal[id];
    if (!c) {
      c = await api('/companies/' + id);
      if (c && c.id) cacheModal[id] = c;
    }
 
    // ── dados básicos ──────────────────────────────────────
    const nome  = c.nome_fantasia || c.razao_social || '—';
    const razao = (c.razao_social && c.nome_fantasia &&
                   c.nome_fantasia.trim().toUpperCase() !== c.razao_social.trim().toUpperCase())
                  ? c.razao_social : null;
 
    // ── CNPJ ──────────────────────────────────────────────
    const cnpjRaw = (c.cnpj || '').replace(/\D/g, '');
    const cnpjFmt = cnpjRaw.length >= 14
      ? cnpjRaw.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5')
      : null;
 
    // ── Telefones ──────────────────────────────────────────
    const tels = [c.tel1, c.tel2, c.tel3].filter(Boolean);
    const telHtml = tels.length
      ? tels.map(t => `<a href="tel:${escHtml(t)}">${escHtml(t)}</a>`).join('<span class="sep">·</span>')
      : null;
 
    // ── E-mail ─────────────────────────────────────────────
    const emailHtml = c.email
      ? `<a href="mailto:${escHtml(c.email)}">${escHtml(c.email)}</a>`
      : null;

    // ── WhatsApp confirmado ──────────────────────────────────
    const whatsappHtml = c.whatsapp
      ? '<a href="https://wa.me/' + c.whatsapp.replace(/\D/g,'') + '" target="_blank" rel="noopener" class="wa-link">' +
        escHtml(c.whatsapp) + (c.whatsapp_business ? ' <span class="m-tag m-tag-wa">Business</span>' : '') + '</a>'
      : null;

    // ── Redes sociais ──────────────────────────────────────
    const instagramHtml = c.instagram
      ? `<a href="${escHtml(c.instagram)}" target="_blank" rel="noopener">${escHtml(c.instagram)}</a>`
      : null;
    const facebookHtml = c.facebook
      ? `<a href="${escHtml(c.facebook)}" target="_blank" rel="noopener">${escHtml(c.facebook)}</a>`
      : null;
    const siteHtml = c.site
      ? `<a href="${escHtml(c.site)}" target="_blank" rel="noopener">${escHtml(c.site)}</a>`
      : null;
 
    // ── helper de campo ────────────────────────────────────
    const vazio = '<span class="m-vazio">Não informado</span>';
    const campo = (label, conteudo, mono) =>
      `<div class="m-campo">
        <span class="m-label">${label}</span>
        <span class="m-valor${mono ? ' mono' : ''}">${conteudo || vazio}</span>
      </div>`;
 
    // ── montar campos ──────────────────────────────────────
    const campos = [
      campo('CNPJ',        cnpjFmt ? cnpjFmt : null, true),
      razao ? campo('Razão Social', escHtml(razao), false) : '',
      campo('Município',   escHtml(c.municipio || ''), false),
      campo('Segmento',    escHtml(c.segmento  || ''), false),
      campo('Grupo',       escHtml(c.grupo     || ''), false),
      campo('WhatsApp',    whatsappHtml, false),
      campo('Instagram',   instagramHtml, false),
      campo('Facebook',    facebookHtml, false),
      campo('Site',        siteHtml, false),
      campo('Telefone' + (tels.length > 1 ? 's' : ''), telHtml, false),
      campo('E-mail',      emailHtml, false),
    ].filter(Boolean);
 
    // ── montar modal ───────────────────────────────────────
    document.getElementById('modal-corpo').innerHTML = `
      <div class="m-topo">
        <div class="m-nome">${escHtml(nome)}</div>
        <div class="m-tags">
          ${c.segmento ? `<span class="m-tag m-tag-seg">${escHtml(c.segmento)}</span>` : ''}
          ${c.grupo    ? `<span class="m-tag m-tag-grp">${escHtml(c.grupo)}</span>`    : ''}
        </div>
      </div>
      <div class="m-campos">${campos.join('')}</div>`;
 
    // ── botão carteira ─────────────────────────────────────
    const naCarteira = empresasAtuais.find(i => parseInt(i.id) === id)?.in_my_wallet == 1
                    || document.querySelector(`[data-wid="${id}"]`) !== null;
 
    document.getElementById('modal-rodape').innerHTML = naCarteira
      ? `<div class="badge badge-green" style="width:100%;justify-content:center;padding:11px;font-size:.82rem;">
           ✓ Já está na sua carteira
         </div>`
      : `<button class="btn btn-primary btn-full" onclick="adicionarCarteiraModal(${id})">
           + Adicionar à Carteira
         </button>`;
 
  } catch(e) {
    const msg = e.message || 'Erro na requisição.';
    document.getElementById('modal-corpo').innerHTML =
      `<div class="m-erro">${escHtml(msg)}</div>`;
  }
}
 
async function adicionarCarteiraModal(id) {
  try {
    await api('/wallet/add/' + id, { method: 'POST' });
    toast('Adicionada à carteira.', 'success');
    document.getElementById('modal-rodape').innerHTML =
      `<div class="badge badge-green" style="width:100%;justify-content:center;padding:11px;font-size:.82rem;">
         ✓ Adicionada à carteira
       </div>`;
    const item = empresasAtuais.find(c => parseInt(c.id) === id);
    if (item) item.in_my_wallet = 1;
    // atualizar botão na lista sem recarregar
    document.querySelectorAll(`button[onclick="adicionarCarteira(${id}, this)"]`).forEach(b => {
      b.outerHTML = `<span class="badge badge-green" data-wid="${id}">Na carteira</span>`;
    });
  } catch(e) {
    toast(e.message || 'Erro ao adicionar.', 'error');
  }
}
 
document.getElementById('btn-fechar-modal').addEventListener('click', () => {
  document.getElementById('modal').style.display = 'none';
});
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});
 
// ── INICIALIZAÇÃO ─────────────────────────────────────────────────────────────
renderBc();
carregarCidades();
</script>
